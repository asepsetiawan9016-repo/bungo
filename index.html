<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Media belajar interaktif: mendeskripsikan orang dalam bahasa Inggris / Interactive English learning media"><meta name="theme-color" content="#438fe8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%91%E2%80%8D%F0%9F%8E%93%3C/text%3E%3C/svg%3E"><title>Describing People – Interactive Learning Media</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#a9defc;--bg2:#eaf8ff;--card:#fff;--ink:#1d2b53;--ink2:#4b5a85;--sky:#2f8cf5;--sun:#ffd23f;--or:#ff8a3d;--ok:#12a461;--bad:#e5484d;--line:#cfe2f7;--pink:#ff5fa2;--pur:#7c5cf5;--hill1:#9be8ab;--hill2:#55d18a;--cloud:#fff;--shadow:0 10px 24px rgba(40,80,150,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#15275a;--bg2:#241f55;--card:#26356b;--ink:#f3f6ff;--ink2:#b9c6f0;--line:#43559a;--hill1:#2c4f7a;--hill2:#1f3b66;--cloud:#46568f;--shadow:0 10px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg1:#15275a;--bg2:#241f55;--card:#26356b;--ink:#f3f6ff;--ink2:#b9c6f0;--line:#43559a;--hill1:#2c4f7a;--hill2:#1f3b66;--cloud:#46568f;--shadow:0 10px 24px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 75%) fixed;color:var(--ink);font-family:"Baloo 2",system-ui,"Segoe UI",sans-serif;font-size:1.12rem;line-height:1.4;min-height:100vh;min-height:100dvh;overflow-x:hidden}
.wrap{max-width:860px;margin:auto;padding:14px 16px 110px;position:relative}
small{opacity:.85;font-weight:500;color:var(--ink2)}
h1,h2{font-family:"Fredoka","Baloo 2",system-ui,sans-serif;font-weight:600;line-height:1.1;margin:.2em 0 .45em}
h1{font-size:2.6rem}
h2{font-size:1.75rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .4em}
h2 small{font-size:.95rem;font-family:"Baloo 2",system-ui,sans-serif}
h2::after{content:"";flex-basis:100%;height:7px;width:84px;border-radius:9px;margin-top:6px;background:linear-gradient(90deg,var(--pink),var(--or),var(--sun))}
p{margin:.5em 0}

/* scene background */
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.scene .sun{position:absolute;top:-70px;right:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#fff8b8 0,#ffe066 42%,rgba(255,224,102,0) 70%);animation:glow 4s ease-in-out infinite}
.scene .cl{position:absolute;left:0;width:150px;fill:var(--cloud);opacity:.9;animation:cloud linear infinite}
.scene .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:24vh;min-height:110px}
.scene .h1{fill:var(--hill1)}.scene .h2{fill:var(--hill2)}
.bgi{position:absolute;bottom:-60px;opacity:.5;animation:drift linear infinite}
@keyframes cloud{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
@keyframes glow{50%{transform:scale(1.12);opacity:.85}}
@keyframes drift{to{transform:translateY(-120vh) rotate(25deg)}}

/* buttons */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:0;z-index:20;padding:8px 0;backdrop-filter:blur(6px)}
.pill{font-weight:800;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:2px 14px;box-shadow:var(--shadow);white-space:nowrap}
.btn{font:inherit;font-weight:800;background:linear-gradient(180deg,#ffe36b,#ffc02e);color:#3b2a00;border:0;border-bottom:5px solid #e08a12;border-radius:20px;padding:10px 22px;cursor:pointer;transition:transform .15s,filter .15s;box-shadow:0 8px 14px rgba(224,138,18,.25)}
.btn:hover{transform:translateY(-3px) scale(1.04);filter:saturate(1.15)}.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.sm{font-size:1rem;padding:6px 16px;border-radius:16px;border-bottom-width:4px}
.btn.xl{font-size:1.7rem;padding:14px 44px;border-radius:26px;background:linear-gradient(180deg,#52e08e,#16b765);color:#fff;border-bottom-color:#0b8a4a;box-shadow:0 10px 18px rgba(11,138,74,.3);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.xl small{color:#e9fff3}
.btn.back{background:linear-gradient(180deg,#fff,#e6f1ff);color:#14447f;border-bottom-color:#8db8ee;box-shadow:0 6px 12px rgba(47,140,245,.18)}
button:focus-visible,.inp:focus-visible{outline:4px solid var(--pur);outline-offset:3px}
.inp{display:block;width:100%;font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:16px;padding:7px 14px;margin-top:4px}
.inp:focus{border-color:var(--sky)}
.scr{animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:16px 20px;margin:12px 0;box-shadow:var(--shadow)}
.card.id-card{border-color:#ffd9a0}
.card b:first-child{color:var(--or)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.id{background:#fff0a8;color:#6b4a00;border-radius:10px;padding:0 9px;font-weight:700;border:2px solid #ffd43b}
.ds{background:#d6ebff;color:#0f4c8a;border-radius:10px;padding:0 9px;font-weight:700;border:2px solid #8cc4fb}

/* menu tiles */
.tile{--c:var(--sky);font:inherit;font-weight:800;font-size:1.15rem;line-height:1.15;color:var(--ink);background:var(--card);background:color-mix(in srgb,var(--c) 13%,var(--card));border:3px solid var(--c);border-bottom-width:8px;border-radius:26px;padding:14px 8px 12px;cursor:pointer;transition:transform .18s,box-shadow .18s;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;overflow:hidden}
.tile .ib{display:flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:50%;font-size:2rem;background:var(--c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 4px 0 rgba(0,0,0,.08);margin-bottom:2px}
.tile small{font-weight:600;font-size:.85rem}
.tile:hover,.tile.on{transform:translateY(-5px) rotate(-1deg);box-shadow:0 14px 26px rgba(30,60,130,.22)}
.tile.on{background:var(--c);color:#fff}
.tile:hover .ib{animation:wig .5s}
.grid>.tile{animation:pop .5s backwards}
.t-tag{position:absolute;top:8px;right:8px;font-size:1.1rem}

/* options */
.opt{display:block;width:100%;font:inherit;font-weight:700;background:var(--card);color:var(--ink);border:3px solid var(--line);border-bottom-width:6px;border-radius:20px;padding:10px 16px;margin:9px 0;cursor:pointer;text-align:left;transition:transform .15s,background .15s,border-color .15s;box-shadow:0 5px 12px rgba(40,80,150,.08)}
.opt:hover{background:#fff4c2;color:#3b2a00;border-color:#ffc02e;transform:translateY(-2px) scale(1.015)}
.opt.sel{border-color:var(--or);background:#ffe9b8;color:#3b2a00}
.opt.done{background:var(--ok);color:#fff;border-color:#0b7a46}
.opt .lt{display:inline-grid;vertical-align:middle;margin-right:10px;width:34px;height:34px;border-radius:50%;place-items:center;color:#fff;font-weight:800;background:var(--sky);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.opt:nth-of-type(4n+2) .lt{background:var(--pink)}.opt:nth-of-type(4n+3) .lt{background:var(--or)}.opt:nth-of-type(4n+4) .lt{background:var(--ok)}
.opt .ico{height:104px;width:auto;margin:0 auto;display:block}
.cols .opt{justify-content:center;text-align:center;min-height:60px}
.chip{font:inherit;font-weight:700;background:#ffe9a6;color:#4a3600;border:0;border-bottom:4px solid #f0b92e;border-radius:999px;padding:5px 16px;margin:4px;cursor:pointer;transition:transform .15s}
.chip:hover{transform:translateY(-2px) scale(1.05)}
.chip:nth-child(5n+2){background:#ffd1e3;border-bottom-color:#f08ab4;color:#5a1236}
.chip:nth-child(5n+3){background:#c9f2dd;border-bottom-color:#5ec796;color:#0a4a2c}
.chip:nth-child(5n+4){background:#d6e6ff;border-bottom-color:#8fb4f5;color:#0f3a78}
.chip:nth-child(5n+5){background:#e5dbff;border-bottom-color:#b19df5;color:#33217a}
.chip.on{background:var(--sky);color:#fff;border-bottom-color:#1a5fc2}
.bl{font:inherit;font-weight:800;min-width:74px;background:var(--card);color:var(--ink);border:3px dashed var(--or);border-radius:14px;cursor:pointer}
.msg{font-weight:800;min-height:1.6em}.ok{color:var(--ok)}.no{color:var(--bad)}
.fbk{text-align:center;padding:14px 10px}
.fbk .big{font-size:4.2rem;animation:pop .5s}
.fbk .mascot{width:150px;height:188px;margin:0 auto;animation:bob 1.6s ease-in-out infinite}

/* effects */
.st{position:fixed;bottom:25%;font-size:2rem;animation:up 1.2s ease-out forwards;pointer-events:none;z-index:60}
.cf{position:fixed;top:-20px;width:10px;height:15px;border-radius:2px;pointer-events:none;z-index:60;animation:fall 1.9s ease-in forwards}
@keyframes up{to{transform:translateY(-240px) rotate(40deg);opacity:0}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.shake{animation:shk .45s}
@keyframes shk{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}to{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes pls{50%{transform:scale(1.07)}}
@keyframes wig{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes gw{from{transform:scaleX(0)}}
@keyframes grow{from{transform:scale(0)}to{transform:scale(var(--sx),var(--sy))}}
@keyframes flipin{from{transform:rotateY(90deg)}to{transform:none}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}30%{transform:rotate(-16deg)}60%{transform:rotate(8deg)}}
@keyframes floaty{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
@keyframes rainbow{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{display:inline-block;animation:bob 1.4s ease-in-out infinite}
.btn.xl{animation:pls 1.8s ease-in-out infinite}
.av svg,svg.avs{overflow:visible}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.wv{transform-origin:142px 172px;animation:wave 1.4s ease-in-out infinite}
.fl{animation:floaty 2.2s ease-in-out infinite}
.fl2{animation-delay:1.1s}

/* hero */
.hero{text-align:center;padding:14px 0 10px;position:relative}
.sunburst{position:absolute;left:50%;top:-6px;width:min(420px,90vw);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.55) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 40s linear infinite;z-index:0}
.chars{display:flex;justify-content:center;align-items:flex-end;gap:4px;position:relative;z-index:1;height:210px}
.ch{display:block;width:30%;max-width:150px;position:relative;animation:bob 2s ease-in-out infinite}
.ch::after{content:"";position:absolute;left:12%;right:12%;bottom:-6px;height:14px;border-radius:50%;background:rgba(30,60,120,.18);z-index:-1}
.ch.c1{animation-delay:.35s;height:100%}.ch.c2{animation-delay:.7s}.ch.c0,.ch.c2{height:92%}
.ch svg{display:block;width:100%;height:100%}
.ttl{margin:.35em 0 .1em;font-size:3rem;line-height:1.02;position:relative;z-index:1}
.ttl .lt{display:inline-block;animation:rainbow 2.2s ease-in-out infinite;text-shadow:0 4px 0 rgba(30,40,90,.18),0 0 0 #fff;-webkit-text-stroke:1.5px rgba(255,255,255,.7);paint-order:stroke fill}
.sub{position:relative;z-index:1;font-weight:700}
.hero .card{position:relative;z-index:1}

/* stage (Build a Friend) */
.stage{height:320px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:radial-gradient(circle at 50% 38%,#fff 0,#e1f4ff 55%,#cfeaff 100%);border:3px solid var(--line);border-radius:28px;margin-bottom:10px;padding-bottom:10px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.stage::before{content:"";position:absolute;left:8%;right:8%;bottom:0;height:62px;border-radius:50% 50% 0 0;background:linear-gradient(180deg,var(--hill1),var(--hill2))}
.stage .av{position:relative;transform-origin:bottom center;transform:scale(var(--sx),var(--sy));animation:grow .5s;width:170px;height:212px;margin-bottom:2px}
.stage .face{width:100%!important;height:100%!important}
.stage .face svg{display:block;width:100%;height:100%}
.acc{position:absolute;top:12px;right:12px;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:2px 14px;font-size:1.2rem;box-shadow:var(--shadow);z-index:2}
:root:not([data-theme="light"]) .stage{--dk:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage{background:radial-gradient(circle at 50% 38%,#3b4f92 0,#2a3a75 60%,#1f2c5f 100%)}}
:root[data-theme="dark"] .stage{background:radial-gradient(circle at 50% 38%,#3b4f92 0,#2a3a75 60%,#1f2c5f 100%)}

/* progress, badges */
.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:8px 14px;background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.bdg{font-size:1.8rem;filter:grayscale(1);opacity:.35;transition:.3s}.bdg.got{filter:none;opacity:1;animation:pop .5s}
.bar{height:16px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}.bar i{display:block;height:100%;transform-origin:left;background:linear-gradient(90deg,#52e08e,#ffd23f,#ff8a3d,#ff5fa2);border-radius:9px;transition:width .4s;animation:gw .6s}
.qmeta{display:flex;align-items:center;gap:8px}
.qtype{display:inline-block;background:var(--pur);color:#fff;border-radius:999px;padding:0 12px;font-weight:700;font-size:.9rem}
.qtype small{color:#efe9ff}

/* memory */
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{font:inherit;font-weight:800;font-size:1.05rem;height:96px;border-radius:20px;border:3px solid #1b66d1;border-bottom-width:6px;background:radial-gradient(circle at 25% 20%,#ffffff55 0,transparent 30%),linear-gradient(145deg,#4aa8ff,#7c5cf5);color:#fff;cursor:pointer;word-break:break-word;padding:4px;display:grid;place-items:center;transition:transform .15s;box-shadow:0 5px 12px rgba(47,110,200,.22)}
.mc:hover{transform:translateY(-3px) rotate(-1.5deg)}
.mc .q{font-family:"Fredoka",sans-serif;font-size:2.4rem;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.mc.up{background:var(--card);color:var(--ink);border-color:var(--line);animation:flipin .35s}
.mc.fnd{background:#dcfbe9;color:#0a4a2c;border-color:var(--ok)}
.mc .ico{height:82px;width:auto;display:block}
.ico{display:block}

@media (max-width:520px){
 h1{font-size:2.1rem}.ttl{font-size:2.3rem}.grid,.cols{gap:10px}
 .wrap{padding-left:13px;padding-right:13px}
 .chars{height:168px}
 .stage{height:290px}.stage .av{width:140px;height:175px}
 .tile{font-size:1rem;padding:12px 6px 10px}.tile .ib{width:54px;height:54px;font-size:1.7rem}
 .mc{height:88px}.mc .ico{height:70px}
 .opt .ico{height:84px}
 .pill{font-size:.9rem;padding:1px 10px}
}

/* full screen button + mode */
.fsb{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:50;width:54px;height:54px;padding:0;display:none;align-items:center;justify-content:center;font:inherit;background:linear-gradient(180deg,#ffe36b,#ffc02e);color:#3b2a00;border:0;border-bottom:5px solid #e08a12;border-radius:50%;cursor:pointer;box-shadow:0 6px 14px rgba(18,48,77,.28);transition:transform .15s}
.fsb.can{display:flex}.fsb:hover{transform:translateY(-3px) scale(1.06)}.fsb:active{transform:translateY(2px)}
.fsb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fsb .c{display:none}.fsb.on .e{display:none}.fsb.on .c{display:block}
html:fullscreen,html:-webkit-full-screen{background:var(--bg2);overflow:auto}
html.fs body{background:transparent;font-size:1.3rem}
html.fs .wrap{max-width:1000px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
html.fs .stage{height:340px}
@media (max-width:520px){html.fs body{font-size:1.15rem}}
.fsb.snd{bottom:max(78px,calc(env(safe-area-inset-bottom,0px) + 78px));font-size:1.5rem;line-height:1}

/* tombol lanjut antar materi & kegiatan */
.nxb{position:sticky;bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:18px 70px 0 0;padding:8px 10px;background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.nxb .btn{white-space:nowrap}
.nxb .btn.nx{flex:1;background:linear-gradient(180deg,#52e08e,#16b765);color:#fff;border-bottom-color:#0b8a4a;box-shadow:0 8px 14px rgba(11,138,74,.28);text-shadow:0 2px 0 rgba(0,0,0,.18);font-size:1.15rem}
.nxb .btn.nx small{color:#e9fff3;opacity:.9}
.nxb .st{position:static;animation:none;font-size:.85rem;font-weight:800;color:var(--ink2);white-space:nowrap;pointer-events:auto}
@media (max-width:520px){.nxb{margin-right:62px;gap:6px;padding:6px 8px}.nxb .btn{padding:8px 12px}.nxb .btn.nx{font-size:1rem}.nxb .st{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn small{color:inherit;opacity:.75}.btn.xl small{opacity:.9}
.qh::after{display:none}.qh{display:block}.qh small{display:block;font-size:1rem;margin-top:2px}
.fbk h2{justify-content:center}.fbk h2::after{margin-left:auto;margin-right:auto}
.g3{grid-template-columns:repeat(3,1fr)}.g3 .gopt{padding:10px 4px}.gopt small{font-size:.8rem}
.gopt{display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center!important;gap:0}
.gimg{display:block;width:120px;height:150px}
.gopt b{font-size:1.2rem}
@media (max-width:520px){.gimg{width:92px;height:115px}}

/* musik latar */
.fsb.mus{bottom:max(142px,calc(env(safe-area-inset-bottom,0px) + 142px));font-size:1.5rem;line-height:1}
.fsb.mus.on{background:linear-gradient(180deg,#8be8b0,#2fc77a);border-bottom-color:#0b8a4a;animation:beat 1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.09)}}
.mpan{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(206px,calc(env(safe-area-inset-bottom,0px) + 206px));z-index:60;width:min(290px,calc(100vw - 28px));max-height:calc(100dvh - 230px);overflow:auto;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:12px;box-shadow:var(--shadow);animation:in .25s ease}
.mpan[hidden]{display:none}
.mh{font-family:"Fredoka","Baloo 2",system-ui,sans-serif;font-weight:600;font-size:1.2rem;margin:0 4px 8px}
.mo{display:flex;align-items:center;gap:10px;width:100%;font:inherit;font-weight:800;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:18px;padding:6px 12px;margin:0 0 7px;cursor:pointer;text-align:left;line-height:1.1;transition:transform .15s}
.mo .ic{font-size:1.5rem}.mo small{display:block;font-weight:500}
.mo:hover{transform:translateX(-3px)}
.mo.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.mv{display:flex;align-items:center;gap:8px;margin:4px 4px 0}.mv input{flex:1;accent-color:var(--pur);height:28px}

/* pronunciation */
.pcard{background:var(--card);border:3px solid #ffd9a0;border-radius:28px;padding:18px 16px 16px;margin:12px 0;box-shadow:var(--shadow);text-align:center}
.pw{font-family:"Fredoka","Baloo 2",system-ui,sans-serif;font-weight:600;font-size:2.7rem;line-height:1.05;color:var(--or);word-break:break-word}
.ipa{display:inline-block;margin:8px 0 6px;padding:2px 18px;border-radius:999px;background:#e5dbff;color:#33217a;font-family:"Noto Sans","Segoe UI","DejaVu Sans","Charis SIL",system-ui,sans-serif;font-weight:600;font-size:1.25rem;letter-spacing:.02em}
.pread{font-weight:700}.pread b{color:var(--sky);font-size:1.25em}
.pmean{font-weight:800;margin-top:2px}
.ptip{margin:10px auto 0;max-width:520px;padding:8px 14px;border-radius:18px;background:color-mix(in srgb,var(--sun) 28%,var(--card));border:2px dashed var(--sun);font-weight:600;text-align:left}
.pbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.btn.mic{background:linear-gradient(180deg,#ff8aa8,#ee3f6f);color:#fff;border-bottom-color:#b81f4a;box-shadow:0 8px 14px rgba(184,31,74,.28)}
.btn.mic.rec{animation:beat .9s ease-in-out infinite}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pnav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
@media (max-width:520px){.pw{font-size:2.2rem}.pbtns .btn{padding:8px 14px;flex:1 1 40%}}

/* presenter */
.fsb.pg{right:auto;left:max(14px,env(safe-area-inset-left,0px));font-size:1.5rem;line-height:1;opacity:.5}
.fsb.pg:hover,.fsb.pg.on{opacity:1}
.fsb.pg.on{background:linear-gradient(180deg,#c9b8ff,#7c5cf5);color:#fff;border-bottom-color:#4b34b8}
.pgp:not(.pop){position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:max(78px,calc(env(safe-area-inset-bottom,0px) + 78px));z-index:60;width:min(360px,calc(100vw - 28px));max-height:calc(100dvh - 110px);overflow:auto;border:3px solid var(--pur);border-radius:22px;box-shadow:var(--shadow);animation:in .25s ease}

const SFX={
 tap:[[700,0,.08,"sine",.18]],
 menu:[[523,0,.09,"triangle",.22],[784,.07,.14,"triangle",.22]],
 back:[[500,0,.08,"triangle",.2],[380,.07,.12,"triangle",.2]],

function sfx(k){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();const n=AC.currentTime;
 (SFX[k]||[]).forEach(([f,t,d,w,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.setValueAtTime(f,n+t);g.gain.setValueAtTime(v,n+t);g.gain.exponentialRampToValueAtTime(.0001,n+t+d);o.connect(g);g.connect(AC.destination);o.start(n+t);o.stop(n+t+d+.02)})}catch(e){}}

 if(s==0){if(!mt.d.includes(p[i][1]))mt.sel=i}

 draw()}
